       <div class="absolute bottom-4 left-0 right-0 text-center opacity-0 group-hover:opacity-100 transition-opacity"><span class="bg-yellow-300 text-gray-900 text-xs py-1 px-3 rounded-full font-bold border-2 border-gray-900">Add speech bubbles in Canva! 💬</span>

  <script src="/_sdk/c939c145c3c74230.editing_sdk.js" integrity="sha512-jh2pv/gl9Gzzn5dxfzwQO4wkqtnAQIim+LIUDYfVu2cdqPkQV2MqbjsDUW5IYbrSZFjRlOBrIWzlvWDXQYxOjg=="></script>
  <script>
        lucide.createIcons();

        // 1. CHANGED: Removing the direct Google URLs and empty API key.
        // We now point directly to the Netlify functions you will create.
        const TEXT_FUNCTION_URL = '/.netlify/functions/generate-script';
        const IMAGE_FUNCTION_URL = '/.netlify/functions/generate-image';

        const generateBtn = document.getElementById('generate-btn');
        const loadExampleBtn = document.getElementById('load-example');
        const dialogueInput = document.getElementById('dialogue');
        const scenarioSelect = document.getElementById('scenario');
        const styleSelect = document.getElementById('style');
        const emptyState = document.getElementById('empty-state');
        const loadingState = document.getElementById('loading-state');
        const loadingText = document.getElementById('loading-text');
        const resultsState = document.getElementById('results-state');
        const errorBanner = document.getElementById('error-banner');
        const errorMessage = document.getElementById('error-message');
        const scriptContainer = document.getElementById('script-container');
        const comicImage = document.getElementById('comic-image');
        const downloadBtn = document.getElementById('download-btn');

        const exampleDialogue = `Panel 1: (At the UN)
A: Aurelia Island is ours!
Panel 2:
B: No, it's international water. We will drill for oil.
Panel 3:
A: You can't drill! The turtles will die.
Panel 4:
B: Our economy is bad. We need the money.
Panel 5:
A: Let's compromise. Turtles on the east, oil on the west.
Panel 6:
B: Okay, I agree to this diplomatic solution.`;

        loadExampleBtn.addEventListener('click', () => {
            dialogueInput.value = exampleDialogue;
            scenarioSelect.value = "Diplomatic Standoff (MUN Style)";
        });

        const fetchWithRetry = async (url, options, maxRetries = 3) => {
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const errText = await response.text();
                        if (response.status === 429) {
                            await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000 + Math.random() * 1000));
                            continue;
                        }
                        throw new Error(`API Error (${response.status}): ${errText}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, Math.pow(2, i) * 1000 + Math.random() * 1000));
                }
            }
        };

        const showError = (msg) => {
            errorBanner.classList.remove('hidden');
            errorMessage.textContent = msg;
            setLoading(false);
        };
        const hideError = () => errorBanner.classList.add('hidden');

        const setLoading = (isLoading, text = "") => {
            if (isLoading) {
                generateBtn.disabled = true;
                generateBtn.classList.add('opacity-75');
                emptyState.classList.add('hidden');
                resultsState.classList.add('hidden');
                loadingState.classList.remove('hidden');
                loadingState.classList.add('flex');
                loadingText.textContent = text;
            } else {
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-75');
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
            }
        };

        const showResults = () => {
            setLoading(false);
            emptyState.classList.add('hidden');
            resultsState.classList.remove('hidden');
            resultsState.classList.add('grid');
        };

        const processTextAndGeneratePrompt = async (scenario, style, text) => {
            const systemPrompt = `You are an expert English teacher and comic strip scripter helping 14-15 year old ESL students.
Task 1: Correct the grammar and elevate the vocabulary of the student's dialogue based on the Scenario, but keep it punchy enough for comic speech bubbles.
Task 2: Write a master image prompt for a 6-panel comic page.
STRICT INSTRUCTIONS FOR IMAGE PROMPT:
- Describe a professional comic book page layout on a single canvas, featuring a clean 2x3 grid (6 panels total).
- Maintain character consistency across all panels.
- CRITICAL: You must explicitly state: "No text, no words, and no speech bubbles anywhere in the image."
- CRITICAL: The prompt MUST end with this exact style descriptor: "${style}".`;

            const payload = {
                contents: [{ parts: [{ text: `Scenario: ${scenario}\nStudent Dialogue:\n${text}` }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            refinedScript: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        panelNumber: { type: "NUMBER" },
                                        caption: { type: "STRING" },
                                        dialogue: { type: "ARRAY", items: { type: "STRING" } }
                                    },
                                    required: ["panelNumber", "caption", "dialogue"]
                                }
                            },
                            imagePrompt: { type: "STRING" }
                        },
                        required: ["refinedScript", "imagePrompt"]
                    }
                }
            };

            // 2. CHANGED: Using the Netlify function URL
            const data = await fetchWithRetry(TEXT_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                return JSON.parse(data.candidates[0].content.parts[0].text);
            }
            throw new Error("Failed to generate script structure.");
        };

        const generateImage = async (imagePrompt) => {
            const payload = {
                contents: [{ role: 'user', parts: [{ text: imagePrompt }] }],
                generationConfig: { responseModalities: ['IMAGE'], imageConfig: { aspectRatio: "3:4" } }
            };

            // 3. CHANGED: Using the Netlify function URL
            const data = await fetchWithRetry(IMAGE_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const part = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData);
            if (part && part.inlineData) {
                return `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
            }
            throw new Error("Failed to generate image.");
        };

        const renderScript = (scriptArray) => {
            scriptContainer.innerHTML = '';
            scriptArray.forEach(panel => {
                const div = document.createElement('div');
                div.className = 'speech-bubble';
                const dialogueHTML = panel.dialogue.map(line => {
                    const colonIdx = line.indexOf(':');
                    const speaker = line.substring(0, colonIdx);
                    const words = line.substring(colonIdx + 1);
                    return `<p class="mt-1.5 text-gray-800 text-sm"><span class="font-bold text-rose-600">${speaker}:</span>${words}</p>`;
                }).join('');
                div.innerHTML = `
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-gray-900 text-yellow-300 text-xs font-bold px-2 py-0.5 rounded">P${panel.panelNumber}</span>
                        <span class="text-xs text-gray-500 uppercase tracking-wider font-bold">${panel.caption}</span>
                    </div>
                    ${dialogueHTML}
                `;
                scriptContainer.appendChild(div);
            });
        };

        window.copyScript = () => {
            const text = Array.from(scriptContainer.children).map(el => el.innerText.trim()).join('\n\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector('button[onclick="copyScript()"]');
                btn.innerText = "Copied! ✓";
                setTimeout(() => btn.innerText = "Copy", 2000);
            }).catch(() => {});
        };

        generateBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const dialogueText = dialogueInput.value.trim();
            if (!dialogueText) { showError("Please enter your dialogue first!"); return; }
            hideError();
            try {
                setLoading(true, "Step 1: Refining your script & grammar... ⚡");
                const result = await processTextAndGeneratePrompt(scenarioSelect.value, styleSelect.value, dialogueText);
                renderScript(result.refinedScript);
                setLoading(true, "Step 2: Drawing your comic panels... 🎨 (~15s)");
                const imageUrl = await generateImage(result.imagePrompt);
                comicImage.src = imageUrl;
                downloadBtn.href = imageUrl;
                showResults();
            } catch (error) {
                showError(error.message || "Something went wrong. Please try again.");
                setLoading(false);
            }
        });
    </script>
